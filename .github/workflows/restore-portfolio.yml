name: Restore photography portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Initialize photography portfolio restore'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Restore portfolio snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/criocreatives/byLYNCH/c7f910759b45773f0fa127ff8407f2d46591e79d"
          files=(
            "CNAME"
            "README.md"
            "index.html"
            "assets/brand/lynch-favicon.png"
            "assets/brand/lynch-logo.png"
            "assets/photos/bw-gold-portrait.jpg"
            "assets/photos/bw-headshot.jpg"
            "assets/photos/bw-portrait-hands.jpg"
            "assets/photos/bw-profile-close.jpg"
            "assets/photos/desert-back-close.jpg"
            "assets/photos/desert-back-wide.jpg"
            "assets/photos/locs-portrait.jpg"
            "assets/photos/lowlight-face.jpg"
            "assets/photos/male-portrait.jpg"
            "assets/photos/orange-fashion.jpg"
            "assets/photos/silver-hair-back.jpg"
            "assets/photos/street-scene.jpg"
            "assets/photos/sunhat-portrait.jpg"
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl -fL "$BASE/$f" -o "$f"
          done
          printf '%s\n' 'portfolio.bylynch.com' > CNAME

      - name: Commit restored site
        shell: bash
        run: |
          git config user.name "Crio Creatives"
          git config user.email "actions@users.noreply.github.com"
          git add CNAME README.md index.html assets
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Restore byLYNCH photography portfolio"
            git push
          fi
